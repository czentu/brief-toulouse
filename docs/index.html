<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brief</title>
<link rel="manifest" href="/brief-toulouse/manifest.webmanifest">
<link rel="apple-touch-icon" href="/brief-toulouse/icon-180.png">
<link rel="icon" type="image/png" href="/brief-toulouse/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brief">
<meta name="theme-color" content="#F9F9F7">
<style>
  :root { --bg: #F9F9F7; --ink: #2E2C27; --soft: #6B6A63; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1C1B19; --ink: #ECEAE3; --soft: #A9A79E; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--soft);
         font: 16px -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 0 16px; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { font-family: Georgia, serif; color: var(--ink); font-size: 26px; margin: 20px 0 8px; }
</style>
</head>
<body>
  <div>
    <img src="/brief-toulouse/icon-180.png" alt="">
    <h1>Ton premier brief arrive bientôt</h1>
    <p>Il paraîtra ici en semaine à 7h30 et à 16h30.</p>
  </div>
</body>
