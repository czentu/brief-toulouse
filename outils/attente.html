<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="15">
<title>{{MOMENT}} en préparation</title>
<style>
:root { --bg: #F9F9F7; --ink: #2E2C27; --soft: #6B6A63; --grey: #B4B3A8; --clay: #C6613F; }
@media (prefers-color-scheme: dark) { :root { --bg: #1C1B19; --ink: #ECEAE3; --soft: #A9A79E; --grey: #6F6E66; --clay: #D97757; color-scheme: dark } }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--soft); font-family: -apple-system, "Segoe UI", sans-serif;
  display: grid; place-items: center; text-align: center; padding: 0 16px; }
main { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 460px; }
svg { width: 96px; height: 96px; }
.sun { fill: var(--clay); animation: rise 3.2s ease-in-out infinite alternate; transform-origin: 48px 53px; }
@keyframes rise { from { transform: translateY(8px); } to { transform: translateY(-2px); } }
@media (prefers-reduced-motion: reduce) { .sun { animation: none; } }
h1 { font-family: Georgia, serif; color: var(--ink); font-size: 28px; font-weight: 600; margin: 6px 0 0; }
p { margin: 0; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 96 96" aria-hidden="true">
    <defs><clipPath id="h"><rect x="0" y="0" width="96" height="53"/></clipPath></defs>
    <g clip-path="url(#h)"><circle class="sun" cx="48" cy="53" r="18"/></g>
    <path d="M10 57 C 24 52, 35 60, 48 56 S 74 52, 86 57" fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" style="color: var(--ink)"/>
    <path d="M28 70 h40 M38 79 h20" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" style="color: var(--grey)"/>
  </svg>
  <h1>{{MOMENT}} en préparation</h1>
  <p>Recherche de la météo, des actualités et des marchés. Le brief s’affichera ici tout seul dans quelques minutes.</p>
</main>
</body>
</html>
